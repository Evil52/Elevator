[package]
name = "Elevator"
version = "0.1.0"
edition = "2024"

[dependencies]

[lints]
workspace = true

[workspace]
members = ["crates/elevator-wire", "crates/elevator-ctrl", "crates/protocol-schema", "sil"]

[workspace.lints.rust]
unsafe_code = "forbid"


[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"



name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always


jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p elevator-ctrl -p elevator-wire --target thumbv7em-none-eabihf

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: firmware
      - run: cargo fmt --all --check
      - run: cargo clippy -p elevator-fw-logic --all-targets --target x86_64-unknown-linux-gnu --locked -- -D warnings
      - run: cargo test -p elevator-fw-logic --target x86_64-unknown-linux-gnu --locked
      - run: cargo clippy -p elevator-fw --release --locked -- -D warnings
      - run: cargo rustc -p elevator-fw --release --locked -- -C link-arg=-Map=target/elevator-fw.map
      - run: grep -E ' \.(vector_table|text|rodata|data|bss|uninit)$' target/elevator-fw.map

  protocol:
    name: TypeScript protocol contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol/v1/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: protocol/v1/ts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run generate && git diff --exit-code -- src/protocol.ts
      - run: npm run typecheck
      - run: npm test

  visualization:
    name: Recordings and viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s viz/blender/sim
      - run: python3 viz/blender/scene/check.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viz/viewer/package-lock.json
      - working-directory: viz/viewer
        run: npm ci --ignore-scripts && npm test && npm run build
